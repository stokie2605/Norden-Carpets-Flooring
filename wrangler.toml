# Cloudflare Pages configuration.
# The name must match the Pages project name exactly.
name = "norden-carpets-flooring"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Public, non secret values only. Secrets live in the Cloudflare dashboard.
# vite.config.ts reads VITE_TURNSTILE_SITE_KEY from here at build time,
# picking [env.preview.vars] on any branch other than main.
[vars]
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAFUfyCvf1216o-Gn"
# Booking emails: sent from the domain verified in Resend, delivered to Dave and Wendy's inbox.
BOOKING_FROM_EMAIL = "Norden Carpets website <bookings@nordencarpets.co.uk>"
BOOKING_TO_EMAIL = "norden.carpetsflooring@gmail.com"

[env.preview.vars]
# Cloudflare Turnstile test site key: always passes.
VITE_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
BOOKING_FROM_EMAIL = "Norden Carpets website <bookings@nordencarpets.co.uk>"
BOOKING_TO_EMAIL = "norden.carpetsflooring@gmail.com"
